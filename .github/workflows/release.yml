name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from cwplugin.json
        id: version
        run: echo "version=$(python -c "import json; print(json.load(open('cwplugin.json'))['version'])")" >> $GITHUB_OUTPUT

      - name: Pack plugin
        run: |
          mkdir -p dist
          FILES="cwplugin.json main.py icon.png README.md LICENSE qml/ RinUI/"
          zip -r "dist/com.newsreview.news-${{ steps.version.outputs.version }}.zip" $FILES -x "*.git*" "*.pyc" "__pycache__/*"
          cp "dist/com.newsreview.news-${{ steps.version.outputs.version }}.zip" "dist/com.newsreview.news-${{ steps.version.outputs.version }}.cwplugin"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
